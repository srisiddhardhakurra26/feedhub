name: Deploy feedhub to Oracle VM

# feedhub shares Scour's VM. Scour's Caddy fronts both and routes by hostname
# (feedhub.167-234-217-97.sslip.io). This workflow lives in the feedhub repo so
# feedhub deploys itself — every push to main auto-deploys (or run it manually
# from the Actions tab). It SSHes to the VM, pulls the latest feedhub, builds +
# starts it on Scour's Docker network, makes sure Caddy has the feedhub route,
# reloads Caddy, and prints diagnostics.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_KEY   the VM's private SSH key
#   SSH_HOST  the VM host/IP
#   SSH_USER  the SSH login user
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-feedhub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy feedhub on the VM
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          REPO=https://github.com/srisiddhardhakurra26/feedhub.git
          DIR="$HOME/feedhub"
          HOSTNAME=feedhub.167-234-217-97.sslip.io
          CADDYFILE="$HOME/scour/Caddyfile"

          echo "::group::1. get / update feedhub source"
          if [ -d "$DIR/.git" ]; then
            git -C "$DIR" fetch --depth 1 origin main
            git -C "$DIR" reset --hard FETCH_HEAD
          else
            git clone --depth 1 "$REPO" "$DIR"
          fi
          echo "::endgroup::"

          echo "::group::2. detect Scour's Docker network"
          NET="$(sudo docker network ls --format '{{.Name}}' | grep -E '^scour.*_default$' | head -1 || true)"
          NET="${NET:-scour_default}"
          echo "Scour network: $NET"
          echo "::endgroup::"

          echo "::group::3. write feedhub env (first run only)"
          if [ ! -f "$DIR/.env" ]; then
            {
              echo "APP_PASSWORD=feedhub"
              echo "SESSION_SECRET=$(openssl rand -hex 32)"
              echo "APP_URL=https://$HOSTNAME"
              echo "DATABASE_URL=file:/data/feedhub.db"
              echo "SCOUR_NETWORK=$NET"
            } > "$DIR/.env"
            echo "wrote fresh .env (APP_PASSWORD=feedhub — change it!)"
          elif grep -q '^SCOUR_NETWORK=' "$DIR/.env"; then
            sed -i "s|^SCOUR_NETWORK=.*|SCOUR_NETWORK=$NET|" "$DIR/.env"
          else
            echo "SCOUR_NETWORK=$NET" >> "$DIR/.env"
          fi
          echo "::endgroup::"

          echo "::group::4. build + (re)start feedhub"
          cd "$DIR"
          # --remove-orphans: the service was renamed app -> feedhub to stop it
          # claiming the "app" DNS alias that collided with Scour. Without this,
          # the old "app"-named container lingers and the new one fails to take
          # the feedhub-app container_name. Safe: data lives on the named volume.
          sudo docker compose up -d --build --remove-orphans
          sudo docker image prune -f
          echo "::endgroup::"

          echo "::group::5. fix Caddy config: ensure feedhub route, remove Scour password"
          # Track whether we actually touched the shared Caddyfile. Caddy fronts
          # Scour too, so we only reload it when something changed — routine
          # feedhub code pushes then cause no blip on Scour.
          CADDY_CHANGED=0
          # feedhub route — add if missing
          if ! grep -q 'feedhub-app:3000' "$CADDYFILE"; then
            printf '\n%s {\n\treverse_proxy feedhub-app:3000\n}\n' "$HOSTNAME" >> "$CADDYFILE"
            echo "appended feedhub block to $CADDYFILE"
            CADDY_CHANGED=1
          else
            echo "feedhub block already present"
          fi
          # Scour password gate — remove it (owner wants Scour open, no login)
          if grep -q 'basic_auth {' "$CADDYFILE"; then
            sed -i '/^[[:space:]]*basic_auth {/,/^[[:space:]]*}/d' "$CADDYFILE"
            echo "removed basic_auth block from $CADDYFILE"
            CADDY_CHANGED=1
          else
            echo "no basic_auth block present"
          fi
          echo "--- current Caddyfile ---"; cat "$CADDYFILE"
          echo "::endgroup::"

          echo "::group::6. reload caddy only if its config changed"
          # IMPORTANT: the Docker commands redirect stdin from /dev/null. Without
          # that, 'docker compose exec' / 'docker exec' consume the rest of this
          # here-doc script (fed to 'bash -se' over SSH stdin), so lines AFTER
          # them silently never run.
          if [ "$CADDY_CHANGED" = "1" ]; then
            # Validate first; if invalid, abort WITHOUT recreating so Scour keeps serving.
            sudo docker compose -f "$HOME/scour/docker-compose.yml" exec -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null
            echo "config valid — recreating caddy to load the new Caddyfile..."
            sudo docker compose -f "$HOME/scour/docker-compose.yml" up -d --force-recreate caddy </dev/null
            echo "caddy recreated"
          else
            echo "Caddyfile unchanged — leaving caddy running (no Scour blip)"
          fi
          echo "::endgroup::"

          echo "::group::7. diagnostics"
          sleep 12
          CADDY="$(sudo docker ps --filter name=caddy --format '{{.Names}}' | head -1)"
          echo "-- containers --"
          sudo docker ps --filter name=feedhub-app --filter name=caddy --format '{{.Names}}  {{.Status}}' </dev/null
          echo "-- hostnames in the RUNNING caddy config (admin API) --"
          sudo docker exec "$CADDY" wget -qO- http://localhost:2019/config/ </dev/null 2>/dev/null \
            | grep -oE '"host":\[[^]]*\]' | sort -u || echo "(could not read admin API)"
          echo "-- can caddy reach feedhub-app:3000? --"
          sudo docker exec "$CADDY" wget -q -O /dev/null --timeout=5 http://feedhub-app:3000/ </dev/null \
            && echo "reachable (HTTP 2xx)" || echo "wget exit non-zero (a redirect/4xx still means the network path works; only DNS/refused = broken)"
          echo "-- feedhub container logs: seed/refresh progress --"
          sudo docker logs --tail 40 feedhub-app 2>&1 | grep -iE '\[seed\]|\[auto\]|migrat' || true
          echo "::endgroup::"

          echo "DONE → https://$HOSTNAME"
          REMOTE
